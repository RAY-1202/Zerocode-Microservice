spring:
  application:
    name: zerocode-user
  session:
    store-type: redis
    timeout: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MYSQL_URL:jdbc:mysql://localhost:3307/zerocode?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:zerocode_local}"
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
server:
  port: 8124
  servlet:
    context-path: /api
springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.ray.zerocodeuser.controller
knife4j:
  enable: true
dubbo:
  registry:
    address: "${NACOS_ADDRESS:nacos://127.0.0.1:8848}"
    register-mode: instance
  protocol:
    name: tri
    port: 50051
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
