spring:
  application:
    name: zerocode-screenshot
server:
  port: 8127
  servlet:
    context-path: /api
cos:
  client:
    host: "${COS_HOST:replace-me}"
    secretId: "${COS_SECRET_ID:replace-me}"
    secretKey: "${COS_SECRET_KEY:replace-me}"
    region: "${COS_REGION:ap-guangzhou}"
    bucket: "${COS_BUCKET:replace-me}"
dubbo:
  registry:
    address: "${NACOS_ADDRESS:nacos://127.0.0.1:8848}"
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
